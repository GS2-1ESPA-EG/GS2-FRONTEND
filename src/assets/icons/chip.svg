<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- chip body -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="#0d2035" stroke="#00d4ff" stroke-width="2"/>
  <!-- inner core -->
  <rect x="24" y="24" width="16" height="16" rx="2" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <!-- inner dots -->
  <circle cx="29" cy="29" r="2" fill="#00d4ff"/>
  <circle cx="35" cy="29" r="2" fill="#00ff88"/>
  <circle cx="29" cy="35" r="2" fill="#00ff88"/>
  <circle cx="35" cy="35" r="2" fill="#00d4ff"/>
  <!-- pins top -->
  <line x1="26" y1="18" x2="26" y2="10" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="32" y2="10" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="18" x2="38" y2="10" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- pins bottom -->
  <line x1="26" y1="46" x2="26" y2="54" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="54" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="46" x2="38" y2="54" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- pins left -->
  <line x1="18" y1="26" x2="10" y2="26" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="10" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="38" x2="10" y2="38" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- pins right -->
  <line x1="46" y1="26" x2="54" y2="26" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="54" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="38" x2="54" y2="38" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
</svg>
