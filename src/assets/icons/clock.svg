<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- circle face -->
  <circle cx="32" cy="32" r="22" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <!-- tick marks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="48" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="48" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- hour hand -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- minute hand -->
  <line x1="32" y1="32" x2="42" y2="32" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="3" fill="#00d4ff"/>
</svg>
