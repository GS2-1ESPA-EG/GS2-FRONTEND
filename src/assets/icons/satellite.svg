  <line x1="48" y1="27" x2="48" y2="37" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="54" y1="27" x2="54" y2="37" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- antenna -->
