  <line x1="10" y1="27" x2="10" y2="37" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="27" x2="16" y2="37" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- solar panel right -->
