  <line x1="32" y1="17.5" x2="32" y2="22" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="32" cy="14" r="7" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="14" r="11" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.25"/>
