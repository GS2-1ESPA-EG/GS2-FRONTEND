<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- box bottom -->
  <path d="M12 28 L32 38 L52 28 L52 50 L32 60 L12 50 Z" fill="#00d4ff" opacity="0.1" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- box top lid -->
  <path d="M12 22 L32 12 L52 22 L32 32 Z" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- vertical edges -->
  <line x1="12" y1="22" x2="12" y2="28" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="52" y1="22" x2="52" y2="28" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="32" y1="32" x2="32" y2="38" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- lid highlight -->
  <path d="M22 17 L32 12 L42 17 L32 22 Z" fill="#00d4ff" opacity="0.4"/>
  <!-- arrow up (open box indicator) -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
  <polyline points="28,11 32,7 36,11" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
