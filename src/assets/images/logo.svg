<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- orbit ring -->
  <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7" transform="rotate(-20 24 24)"/>
  <!-- planet core -->
  <circle cx="24" cy="24" r="10" fill="#0d1b2a" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="24" cy="24" r="10" fill="url(#planetGrad)"/>
  <!-- surface detail -->
  <path d="M18 22 Q22 20 26 22 Q28 24 24 26 Q20 27 18 22Z" fill="#00d4ff" opacity="0.2"/>
  <!-- orbiting dot -->
  <circle cx="10" cy="20" r="3.5" fill="#00ff88"/>
  <circle cx="10" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <!-- defs -->
  <defs>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
</svg>
